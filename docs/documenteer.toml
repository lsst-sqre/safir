[project]
title = "Safir"
copyright = "2020-2024 Association of Universities for Research in Astronomy, Inc. (AURA)"

[project.python]
package = "safir"

[sphinx]
rst_epilog_file = "_rst_epilog.rst"
nitpicky = true
nitpick_ignore = [
    # SerializedJob.phase uses ExecutionPhase members as its Field examples.
    # For the copy of that field inherited by Job, Sphinx 9 renders the
    # annotation's source text, turning each member into a reference target.
    # Documenteer 2.5.0b4 degrades those to plain text only in a build that
    # reads the sources. A build that reuses pickled doctrees (docs-linkcheck
    # run after docs, as Periodic CI does) warns instead. Remove these once
    # https://github.com/lsst-sqre/documenteer/issues/554 is fixed.
    ["py:class", "ExecutionPhase.PENDING"],
    ["py:class", "ExecutionPhase.EXECUTING"],
    ["py:class", "ExecutionPhase.COMPLETED"],
]
extensions = [
    "sphinxcontrib.autodoc_pydantic",
]

[sphinx.intersphinx.projects]
aiokafka = "https://aiokafka.readthedocs.io/en/stable"
arq = "https://arq-docs.helpmanual.io"
click = "https://click.palletsprojects.com/en/stable"
cryptography = "https://cryptography.io/en/latest"
gidgethub = "https://gidgethub.readthedocs.io/en/latest"
pyfakefs = "https://pytest-pyfakefs.readthedocs.io/en/latest"
pytest = "https://docs.pytest.org/en/stable"
python = "https://docs.python.org/3"
schema_registry = "https://marcosschroh.github.io/python-schema-registry-client"
sentry_sdk = "https://getsentry.github.io/sentry-python"
structlog = "https://www.structlog.org/en/stable"
sqlalchemy = "https://docs.sqlalchemy.org/en/latest"
testcontainers = "https://testcontainers-python.readthedocs.io/en/latest"
vomodels = "https://vo-models.readthedocs.io/latest"

[sphinx.linkcheck]
ignore = [
    # StackOverflow sometimes rejects all link checks from GitHub Actions.
    '^https://stackoverflow.com/questions/',
    '^https://github\.com/lsst-sqre/safir/issues/new',
    '^https://github\.com/lsst-sqre/safir/issues/new',
    # This anchor seems dynamically generated
    '^https://github.com/getsentry/sentry/issues/64354#issuecomment-1927839632',
    # Timing out when checked form GitHub Actions
    '^https://arq-docs.helpmanual.io'
]
